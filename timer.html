<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A low-stress, colour-based presentation timer.">
  <meta name="author" content="Camilo León Sánchez">
  <title>Timer</title>
  <style>
    :root {
      --bg: #10231f;
      --fg: #f7fbf8;
      --muted: rgba(247, 251, 248, 0.76);
      --panel: rgba(10, 16, 18, 0.34);
      --panel-border: rgba(247, 251, 248, 0.18);
      --page-start: #36bd82;
      --page-end: #145d49;
      --text-shadow: rgba(3, 22, 17, 0.34);
      --button: rgba(255, 255, 255, 0.12);
      --button-active: rgba(255, 255, 255, 0.24);
      --action: #0f6b52;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.26), transparent 44%),
        linear-gradient(135deg, var(--page-start), var(--page-end) 72%);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background 400ms ease, color 400ms ease;
    }

    body.state-warning {
      --page-start: #f4c430;
      --page-end: #a06b09;
      --text-shadow: rgba(71, 42, 0, 0.34);
      --action: #916109;
    }

    body.state-urgent {
      --page-start: #f26747;
      --page-end: #8e211d;
      --text-shadow: rgba(48, 8, 6, 0.38);
      --action: #8e211d;
    }

    body.state-expired {
      --page-start: #747b86;
      --page-end: #22252b;
      --text-shadow: rgba(0, 0, 0, 0.38);
      --action: #555c66;
    }

    .timer-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .timer-stage {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 72px);
      text-align: center;
    }

    .signal {
      width: min(92vw, 1100px);
      min-height: min(52vh, 520px);
      display: grid;
      place-items: center;
      text-shadow: 0 8px 34px var(--text-shadow);
      transition: transform 400ms ease, text-shadow 400ms ease;
    }

    body.state-urgent .signal {
      animation: pulse 1.4s ease-in-out infinite;
    }

    body.state-expired .signal {
      transform: scale(0.94);
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.035);
      }
    }

    .state-word {
      margin: 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: clamp(3.6rem, 16vmin, 13rem);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 0.92;
      text-transform: uppercase;
    }

    .state-caption {
      display: block;
      margin-top: clamp(10px, 1.8vmin, 20px);
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(0.9rem, 2.4vmin, 1.45rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .controls {
      width: 100%;
      padding: 16px;
      background: var(--panel);
      border-top: 1px solid var(--panel-border);
      backdrop-filter: blur(18px);
    }

    .control-grid {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 1fr 1.1fr;
      gap: 12px;
      align-items: end;
    }

    .control-group {
      display: grid;
      gap: 8px;
    }

    .control-label {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .button-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 8px;
    }

    button,
    input {
      min-height: 52px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--fg);
      font: inherit;
    }

    button {
      background: var(--button);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      touch-action: manipulation;
    }

    button:hover,
    button:focus-visible {
      background: var(--button-active);
      border-color: rgba(255, 255, 255, 0.48);
      outline: none;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary-action {
      background: var(--action);
      border-color: rgba(255, 255, 255, 0.36);
      font-size: 1.08rem;
    }

    .custom-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.28);
      padding: 0 14px;
      font-weight: 800;
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.55);
      outline: none;
    }

    .feedback {
      min-height: 1.2em;
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .timer-shell {
        grid-template-rows: minmax(58vh, 1fr) auto;
      }

      .timer-stage {
        padding: 22px;
      }

      .signal {
        width: min(92vw, 760px);
        min-height: min(46vh, 420px);
      }

      .control-grid {
        grid-template-columns: 1fr;
      }

      .button-row {
        grid-auto-flow: initial;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .controls {
        padding: 12px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }

      .custom-row {
        grid-template-columns: 1fr;
      }

      button,
      input {
        min-height: 48px;
      }
    }
  </style>
</head>

<body class="state-normal">
  <main class="timer-shell">
    <section class="timer-stage" aria-label="Presenter timer state">
      <div class="signal" aria-live="polite" aria-atomic="true">
        <div>
          <p class="state-word" id="stateWord">Steady</p>
          <span class="state-caption" id="stateCaption">Ready</span>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="Timer controls">
      <div class="control-grid">
        <div class="control-group">
          <span class="control-label" id="presetLabel">Preset</span>
          <div class="button-row" aria-labelledby="presetLabel">
            <button type="button" data-minutes="15">15 min</button>
            <button type="button" data-minutes="10">10 min</button>
            <button type="button" data-minutes="5">5 min</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Run</span>
          <div class="button-row">
            <button type="button" class="primary-action" id="startPause">Start</button>
            <button type="button" id="minusMinute">- 1 min</button>
            <button type="button" id="plusMinute">+ 1 min</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label" for="customMinutes">Custom minutes</label>
          <div class="custom-row">
            <input id="customMinutes" type="number" inputmode="decimal" min="0.1" step="0.5" placeholder="Minutes">
            <button type="button" id="setCustom">Set</button>
          </div>
          <p class="feedback" id="feedback" aria-live="polite">Choose a preset or set a custom start.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const minute = 60000;
      const warningThreshold = 5 * minute;
      const urgentThreshold = minute;

      let selectedDuration = 10 * minute;
      let remainingDuration = selectedDuration;
      let deadline = 0;
      let running = false;
      let tickId = 0;

      const stateWord = document.getElementById("stateWord");
      const stateCaption = document.getElementById("stateCaption");
      const startPause = document.getElementById("startPause");
      const feedback = document.getElementById("feedback");
      const customMinutes = document.getElementById("customMinutes");
      const setCustom = document.getElementById("setCustom");
      const minusMinute = document.getElementById("minusMinute");
      const plusMinute = document.getElementById("plusMinute");

      function applyState(remaining) {
        document.body.classList.remove("state-normal", "state-warning", "state-urgent", "state-expired");

        if (remaining <= 0) {
          document.body.classList.add("state-expired");
          stateWord.textContent = "Finish";
          stateCaption.textContent = "Time";
          return;
        }

        if (remaining <= urgentThreshold) {
          document.body.classList.add("state-urgent");
          stateWord.textContent = "Close";
          stateCaption.textContent = "Final stretch";
          return;
        }

        if (remaining <= warningThreshold) {
          document.body.classList.add("state-warning");
          stateWord.textContent = "Soon";
          stateCaption.textContent = "Wrap up";
          return;
        }

        document.body.classList.add("state-normal");
        stateWord.textContent = running ? "Steady" : "Ready";
        stateCaption.textContent = running ? "Continue" : "Set";
      }

      function updateFeedback(message) {
        feedback.textContent = message;
      }

      function stopTicker() {
        if (tickId) {
          window.clearInterval(tickId);
          tickId = 0;
        }
      }

      function render() {
        if (running) {
          remainingDuration = Math.max(0, deadline - Date.now());
          if (remainingDuration <= 0) {
            running = false;
            stopTicker();
            startPause.textContent = "Start";
            updateFeedback("Timer complete.");
          }
        }

        applyState(remainingDuration);
      }

      function setDuration(duration, message) {
        selectedDuration = Math.max(0, duration);
        remainingDuration = selectedDuration;

        if (running) {
          deadline = Date.now() + remainingDuration;
        }

        updateFeedback(message);
        render();
      }

      function startTimer() {
        if (remainingDuration <= 0) {
          updateFeedback("Set a start time before running.");
          render();
          return;
        }

        running = true;
        deadline = Date.now() + remainingDuration;
        startPause.textContent = "Pause";
        updateFeedback("Timer running.");
        stopTicker();
        tickId = window.setInterval(render, 250);
        render();
      }

      function pauseTimer() {
        render();
        running = false;
        stopTicker();
        startPause.textContent = "Start";
        updateFeedback("Timer paused.");
        render();
      }

      function adjustDuration(delta) {
        const current = running ? Math.max(0, deadline - Date.now()) : remainingDuration;
        const next = Math.max(0, current + delta);
        remainingDuration = next;
        selectedDuration = Math.max(selectedDuration + delta, 0);

        if (running) {
          deadline = Date.now() + remainingDuration;
        }

        if (remainingDuration <= 0) {
          running = false;
          stopTicker();
          startPause.textContent = "Start";
          updateFeedback("Timer complete.");
        } else {
          updateFeedback(delta > 0 ? "Added one minute." : "Subtracted one minute.");
        }

        render();
      }

      document.querySelectorAll("[data-minutes]").forEach((button) => {
        button.addEventListener("click", () => {
          const minutes = Number(button.dataset.minutes);
          running = false;
          stopTicker();
          startPause.textContent = "Start";
          setDuration(minutes * minute, `Preset set to ${minutes} minutes.`);
        });
      });

      setCustom.addEventListener("click", () => {
        const value = Number(customMinutes.value);

        if (!Number.isFinite(value) || value <= 0) {
          updateFeedback("Enter a positive number of minutes.");
          customMinutes.focus();
          return;
        }

        running = false;
        stopTicker();
        startPause.textContent = "Start";
        setDuration(value * minute, "Custom start set.");
      });

      customMinutes.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          setCustom.click();
        }
      });

      startPause.addEventListener("click", () => {
        if (running) {
          pauseTimer();
        } else {
          startTimer();
        }
      });

      plusMinute.addEventListener("click", () => adjustDuration(minute));
      minusMinute.addEventListener("click", () => adjustDuration(-minute));

      document.addEventListener("visibilitychange", render);
      render();
    })();
  </script>
</body>

</html>
